name: PHP tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: session
          coverage: none
          tools: none
      - name: Run all PHP test suites
        shell: pwsh
        run: |
          php -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $suites = @('run', 'corrected-controls', 'dashboard', 'reference', 'security', 'benchmark')
          foreach ($suite in $suites) {
              php "tests/$suite.php"
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              php -n "tests/$suite.php"
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
