name: PHP static analysis and workflow checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.2'
          coverage: none
          tools: none
      - name: Run checksum-pinned PHPStan
        shell: pwsh
        run: |
          $phar = Join-Path $env:RUNNER_TEMP 'phpstan-2.3.7.phar'
          Invoke-WebRequest -Uri 'https://github.com/phpstan/phpstan/releases/download/2.3.7/phpstan.phar' -TimeoutSec 45 -OutFile $phar
          $expected = '87fa9aa451bb9b61d7c65d40ec7d14d5bab67e3ad74ce75a09b3140d6f22631a'
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $phar).Hash.ToLowerInvariant() -ne $expected) {
              throw 'PHPStan release checksum mismatch.'
          }
          php $phar analyse --no-progress --memory-limit=512M
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate workflow definitions
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'actionlint-1.7.12.tar.gz'
          Invoke-WebRequest -Uri 'https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz' -TimeoutSec 45 -OutFile $archive
          $expected = '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant() -ne $expected) {
              throw 'actionlint release checksum mismatch.'
          }
          tar -xzf $archive -C $env:RUNNER_TEMP actionlint
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Join-Path $env:RUNNER_TEMP 'actionlint')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
